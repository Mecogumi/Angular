<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>
@if (Makrers().length>0) {

<section class="h-[40vh] sm:fixed sm:w-[260px] bg-white sm:rounded sm:top-20 sm:left-10 p-5 overflow-y-scroll">
  <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>
  <div class="flex flex-col gap-2">
    @for (marker of Makrers(); track marker.id) {
    <div (dblclick)="deleteMarker(marker)" (click)="navigateToMarker(marker)" class="form-control">
      <label class="label cursor-pointer1">
        <span class="label-text text-black text-xs">{{marker.marker.getLngLat() | json}}</span>
        <input type="radio" name="radio-10" class="radio" [style]="{backgroundColor: marker.marker._color}"
          checked="checked" />
      </label>
    </div>
    }@empty {
    <div class="flex justifiy-center items-center bg-blue-100 rounded py-5">
      <p class="text-xs text-secondary">No hay marcadores</p>
    </div>
    }


  </div>


</section>
}
