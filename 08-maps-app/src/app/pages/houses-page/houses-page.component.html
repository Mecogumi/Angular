<section class="container mx-auto">
  <h2 class="text-3xl font-bold b-2">Casas </h2>
  <h3 class="text-xl text-gray-500 mb-2">{{3}} casas disponibles</h3>
</section>

<section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 px-4 ">
  @for (house of houses(); track house.id; let i = $index) {
  <div class="card bg-base-100 w-96 shadow-sm rounded-t-md overflow-hidden">
    <mini-map [house]="house"></mini-map>
    <div class="card-body">
      <h2 class="card-title">
        {{house.name}}
        @if(i===0){
        <div class="badge badge-secondary">NEW</div>
        }
      </h2>
      <p>{{house.description}}</p>
      <div class="card-actions justify-end">
        @for (tag of house.tags; track tag) {
        <div class="badge badge-outline">{{tag}}</div>

        }
      </div>
    </div>
  </div>
  }
</section>
